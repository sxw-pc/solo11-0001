[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl-flow"
version = "0.1.0"
description = "配置驱动的公开数据采集、解析、归一化与入库管道"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "crawl-flow maintainers" }]
dependencies = [
    "httpx==0.27.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pydantic==2.9.2",
    "SQLAlchemy==2.1.8",
    "typer==0.12.5",
    "click==8.1.7",
    "PyYAML==6.0.2",
    "Flask==3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
crawl-flow = "crawl_flow.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
