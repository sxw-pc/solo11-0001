# crawl-flow 源配置
# 每个源必须包含 name / type / base_url；page_size 只对 api 类型生效。
#
# 可选的顶层 notify 段：每轮采集结束后把汇总 JSON POST 到 IM 机器人 webhook。
# 不配置（或保持注释）时不会发出任何额外请求，行为与旧版本一致。
# 地址里带密钥是允许的，但日志只会输出脱敏后的 scheme://host/***。
#
# notify:
#   webhooks:
#     - https://im.example.com/hooks/xxxxxxxx
#     - https://backup.example.com/hooks/yyyyyyyy  # 多个地址逐个推送，互不影响
#   timeout_seconds: 5            # 单次推送超时
#   retries: 2                    # 失败重试次数（传输异常/超时/5xx 才重试，4xx 不重试）
#   retry_backoff_seconds: 0.5    # 重试间隔
#   alert_failure_rate: 0.1       # 失败率严格大于该阈值时消息 level=alert
sources:
  - name: demo_api
    type: api
    base_url: http://127.0.0.1:8010
    enabled: true
    page_size: 5
    timeout_seconds: 10
    # 默认路径分别是 /api/items 与 /api/items/{id}，这里显式写出便于阅读
    list_path: /api/items
    detail_path: /api/items/{id}
    field_map:
      title: title
      category: category
      tags: tags
      published_at: published_at
      content: content
      url: null

  - name: demo_html
    type: html
    base_url: http://127.0.0.1:8010
    enabled: true
    page_size: 5
    timeout_seconds: 10
    list_path: /list
    detail_path: /item/{id}
    field_map:
      title: title
      category: category
      tags: tags
      published_at: published_at
      content: content
      url: null

  # 故障演练源：详情一律返回 500，用来验证错误隔离。
  # 默认 disabled，--all 不会带上；可显式 `--source demo_api_flaky` 运行。
  # 单源 notify 覆盖：该源的汇总只推送到这里的地址，不再走全局 webhook。
  # notify:
  #   webhooks:
  #     - https://im.example.com/hooks/oncall-secret
  - name: demo_api_flaky
    type: api
    base_url: http://127.0.0.1:8010
    enabled: false
    page_size: 5
    timeout_seconds: 10
    list_path: /api/items
    detail_path: /api/items/{id}?fail=1
    field_map:
      title: title
      category: category
      tags: tags
      published_at: published_at
      content: content
      url: null

  # 故障演练源：列表页一律返回 503，用来验证「整轮失败、退出码 2」。
  - name: demo_api_broken
    type: api
    base_url: http://127.0.0.1:8010
    enabled: false
    page_size: 5
    timeout_seconds: 10
    list_path: /api/items?fail=1
    detail_path: /api/items/{id}
    field_map:
      title: title
      category: category
      tags: tags
      published_at: published_at
      content: content
      url: null
